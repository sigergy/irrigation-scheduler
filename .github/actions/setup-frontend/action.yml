name: Setup frontend
description: Install Node with the npm cache and the frontend dependencies (npm ci).

# preparación común del front en tests.yml (job frontend) y release.yml (job package):
# un solo sitio para la versión de Node y la caché de npm
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Dependencias
      shell: bash
      working-directory: frontend
      run: npm ci
